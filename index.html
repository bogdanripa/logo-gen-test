<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flower Logo — SVG rebuild</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f4f6; --text:#1c1c1e; --muted:#6b6b70; --accent:#7a5c8f; --border:#dcdce0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1f; --text:#f0f0f2; --muted:#a0a0a6; --border:#3a3a40; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; text-align:center; }
  img.logo { width: 180px; height: 180px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: var(--muted); line-height:1.5; }
  .links { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 24px; }
  a.btn { background: var(--accent); color:white; text-decoration:none; padding:10px 16px; border-radius:8px; font-size:14px; }
  a.btn.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="Recreated flower logo">
  <h1>Recreating a logo as a scalable, transparent SVG</h1>
  <p>Starting from a single screenshot, rebuilt as a hand-tunable vector graphic — plus the interactive editor used to match it, and the full trail of failed attempts along the way.</p>
  <div class="links">
    <a class="btn" href="editor.html">Open the editor</a>
    <a class="btn secondary" href="logo.svg">View logo.svg</a>
    <a class="btn secondary" href="process/README.md">Read the process notes</a>
  </div>
</main>
</body>
</html>
