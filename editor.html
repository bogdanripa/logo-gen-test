<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Logo Editor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f6;
    --panel: #ffffff;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --border: #dcdce0;
    --accent: #7a5c8f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1f; --panel:#242428; --text:#f0f0f2; --muted:#a0a0a6; --border:#3a3a40; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); display: flex; min-height: 100vh;
  }
  #stage {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    padding: 24px; min-width: 0;
  }
  #canvasWrap {
    position: relative; width: min(90vw, 700px); aspect-ratio: 453/362;
    background: repeating-conic-gradient(#ccc 0% 25%, #eee 0% 50%) 0 0 / 24px 24px;
    border-radius: 8px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  #canvasWrap img, #canvasWrap svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  #panel {
    flex: 0 0 380px; max-width: 380px; background: var(--panel); border-left: 1px solid var(--border);
    padding: 16px; overflow-y: auto; height: 100vh;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
       margin: 18px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .row label { flex: 0 0 108px; color: var(--muted); }
  .row input[type=range] { flex: 1 1 auto; }
  .row input[type=number] { width: 56px; font-size: 12px; }
  .row input[type=color] { width: 32px; height: 22px; padding: 0; border: none; background: none; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 7px 10px; font-size: 12px; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  textarea#out {
    width: 100%; height: 130px; font-family: ui-monospace, monospace; font-size: 10.5px;
    margin-top: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px;
  }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .opacityRow { display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:8px;}
</style>
</head>

<div id="panel">
  <h1>Logo Editor</h1>
  <div class="hint">Reference image underneath, generated logo (ellipses) on top. Tune until they line up, then copy the parameters back.</div>

  <div class="toolbar">
    <button id="copyBtn">Copy parameters</button>
    <button class="secondary" id="resetBtn">Reset</button>
  </div>
  <div class="opacityRow">
    <label style="flex:0 0 108px;color:var(--muted)">Overlay opacity</label>
    <input type="range" id="svgOpacity" min="0" max="1" step="0.01" value="0.85" style="flex:1">
    <label style="flex:0 0 70px;color:var(--muted)"><input type="checkbox" id="diffMode"> difference</label>
  </div>

  <h2>Circle</h2>
  <div id="group-circle"></div>

  <h2>Center (gold ring + dot)</h2>
  <div id="group-center"></div>

  <h2>Light petals</h2>
  <div id="group-light"></div>

  <h2>Dark petals</h2>
  <div id="group-dark"></div>

  <h2>Leaves</h2>
  <div id="group-leaf"></div>

  <h2>Export</h2>
  <textarea id="out" readonly></textarea>
  <div class="hint" id="copyStatus"></div>
</div>

<script>
const params = {
  cx: 203.5, cy: 180.5,
  outerR: 156, outerStroke: 3, outerColor: "#344636",
  innerR: 143, innerStroke: 1.5, innerColor: "#c9b98d",
  goldR: 21.5, goldStroke: 9, goldColor: "#c3a35a",
  dotR: 8.5, dotColor: "#344636",

  lightCount: 6, lightAngleOffset: 0, lightDist: 78, lightRx: 32, lightRy: 62, lightRot: 0, lightColor: "#e3c6c8",
  darkCount: 6, darkAngleOffset: 30, darkDist: 46, darkRx: 38, darkRy: 46, darkRot: 0, darkColor: "#be8085",

  leafAngle: 128, leafDist: 156, leafRx: 40, leafRy: 8, leafTilt: 12, leafColor: "#344636"
};
const DEFAULTS = JSON.parse(JSON.stringify(params));

const fields = [
  { group: "circle", key: "outerR", label: "Outer R", min: 50, max: 200, step: 1 },
  { group: "circle", key: "outerStroke", label: "Outer width", min: 0, max: 10, step: 0.5 },
  { group: "circle", key: "outerColor", label: "Outer color", type: "color" },
  { group: "circle", key: "innerR", label: "Inner R", min: 50, max: 200, step: 1 },
  { group: "circle", key: "innerStroke", label: "Inner width", min: 0, max: 6, step: 0.5 },
  { group: "circle", key: "innerColor", label: "Inner color", type: "color" },
  { group: "circle", key: "cx", label: "Center X", min: 0, max: 453, step: 1 },
  { group: "circle", key: "cy", label: "Center Y", min: 0, max: 362, step: 1 },

  { group: "center", key: "goldR", label: "Ring R", min: 0, max: 60, step: 0.5 },
  { group: "center", key: "goldStroke", label: "Ring width", min: 0, max: 30, step: 0.5 },
  { group: "center", key: "goldColor", label: "Ring color", type: "color" },
  { group: "center", key: "dotR", label: "Dot R", min: 0, max: 30, step: 0.5 },
  { group: "center", key: "dotColor", label: "Dot color", type: "color" },

  { group: "light", key: "lightCount", label: "Count", min: 1, max: 16, step: 1 },
  { group: "light", key: "lightAngleOffset", label: "Angle offset", min: -180, max: 180, step: 1 },
  { group: "light", key: "lightDist", label: "Distance", min: 0, max: 180, step: 1 },
  { group: "light", key: "lightRx", label: "Rx (width)", min: 1, max: 100, step: 1 },
  { group: "light", key: "lightRy", label: "Ry (length)", min: 1, max: 180, step: 1 },
  { group: "light", key: "lightRot", label: "Extra rotate", min: -90, max: 90, step: 1 },
  { group: "light", key: "lightColor", label: "Color", type: "color" },

  { group: "dark", key: "darkCount", label: "Count", min: 1, max: 16, step: 1 },
  { group: "dark", key: "darkAngleOffset", label: "Angle offset", min: -180, max: 180, step: 1 },
  { group: "dark", key: "darkDist", label: "Distance", min: 0, max: 180, step: 1 },
  { group: "dark", key: "darkRx", label: "Rx (width)", min: 1, max: 100, step: 1 },
  { group: "dark", key: "darkRy", label: "Ry (length)", min: 1, max: 180, step: 1 },
  { group: "dark", key: "darkRot", label: "Extra rotate", min: -90, max: 90, step: 1 },
  { group: "dark", key: "darkColor", label: "Color", type: "color" },

  { group: "leaf", key: "leafAngle", label: "Placement angle", min: 0, max: 180, step: 1 },
  { group: "leaf", key: "leafDist", label: "Distance", min: 0, max: 200, step: 1 },
  { group: "leaf", key: "leafRx", label: "Rx (length/2)", min: 1, max: 100, step: 1 },
  { group: "leaf", key: "leafRy", label: "Ry (width/2)", min: 1, max: 40, step: 1 },
  { group: "leaf", key: "leafTilt", label: "Tilt", min: -60, max: 60, step: 1 },
  { group: "leaf", key: "leafColor", label: "Color", type: "color" },
];

function buildControls() {
  const groups = {};
  fields.forEach(f => {
    const container = document.getElementById("group-" + f.group);
    const row = document.createElement("div");
    row.className = "row";
    const label = document.createElement("label");
    label.textContent = f.label;
    row.appendChild(label);

    if (f.type === "color") {
      const input = document.createElement("input");
      input.type = "color";
      input.value = params[f.key];
      input.addEventListener("input", () => { params[f.key] = input.value; render(); });
      row.appendChild(input);
      f._el = input;
    } else {
      const range = document.createElement("input");
      range.type = "range";
      range.min = f.min; range.max = f.max; range.step = f.step;
      range.value = params[f.key];
      const num = document.createElement("input");
      num.type = "number";
      num.min = f.min; num.max = f.max; num.step = f.step;
      num.value = params[f.key];
      range.addEventListener("input", () => { params[f.key] = parseFloat(range.value); num.value = range.value; render(); });
      num.addEventListener("input", () => { params[f.key] = parseFloat(num.value); range.value = num.value; render(); });
      row.appendChild(range);
      row.appendChild(num);
      f._range = range; f._num = num;
    }
    container.appendChild(row);
  });
}

function syncControlsFromParams() {
  fields.forEach(f => {
    if (f._el) f._el.value = params[f.key];
    if (f._range) { f._range.value = params[f.key]; f._num.value = params[f.key]; }
  });
}

function petalPath(rx, ry) {
  // simple ellipse centered at origin, described as a path (so it composes the same way as other shapes)
  return `M ${-rx},0 A ${rx},${ry} 0 1 0 ${rx},0 A ${rx},${ry} 0 1 0 ${-rx},0 Z`;
}

function petalGroup(count, angleOffset, dist, rx, ry, rot, color) {
  let out = "";
  for (let i = 0; i < count; i++) {
    const angle = angleOffset + (360 / count) * i;
    out += `<g transform="rotate(${angle})"><ellipse cx="0" cy="${-dist}" rx="${rx}" ry="${ry}" fill="${color}" transform="rotate(${rot})"/></g>`;
  }
  return out;
}

function leafPath(rx, ry) {
  return `M ${-rx},0 C ${-rx*0.4},${-ry} ${rx*0.4},${-ry} ${rx},0 C ${rx*0.4},${ry} ${-rx*0.4},${ry} ${-rx},0 Z`;
}

function render() {
  const p = params;
  const svg = document.getElementById("svg");
  const toRad = d => d * Math.PI / 180;
  const leafPt = (r, angleDeg) => {
    const a = toRad(angleDeg);
    return [r * Math.sin(a), -r * Math.cos(a)];
  };
  const [lx, ly] = leafPt(p.leafDist, -p.leafAngle);
  const [rx2, ry2] = leafPt(p.leafDist, p.leafAngle);

  svg.innerHTML = `
    <g transform="translate(${p.cx},${p.cy})">
      <g transform="translate(${lx.toFixed(2)},${ly.toFixed(2)}) rotate(${-p.leafTilt})">
        <path d="${leafPath(p.leafRx, p.leafRy)}" fill="${p.leafColor}"/>
      </g>
      <g transform="translate(${rx2.toFixed(2)},${ry2.toFixed(2)}) rotate(${p.leafTilt})">
        <path d="${leafPath(p.leafRx, p.leafRy)}" fill="${p.leafColor}"/>
      </g>
      <circle r="${p.outerR}" fill="none" stroke="${p.outerColor}" stroke-width="${p.outerStroke}"/>
      <circle r="${p.innerR}" fill="none" stroke="${p.innerColor}" stroke-width="${p.innerStroke}"/>
      <g>
        ${petalGroup(p.lightCount, p.lightAngleOffset, p.lightDist, p.lightRx, p.lightRy, p.lightRot, p.lightColor)}
        ${petalGroup(p.darkCount, p.darkAngleOffset, p.darkDist, p.darkRx, p.darkRy, p.darkRot, p.darkColor)}
        <circle r="${p.goldR}" fill="none" stroke="${p.goldColor}" stroke-width="${p.goldStroke}"/>
        <circle r="${p.dotR}" fill="${p.dotColor}"/>
      </g>
    </g>
  `;
  document.getElementById("out").value = JSON.stringify(params, null, 2);
}

document.getElementById("svgOpacity").addEventListener("input", (e) => {
  document.getElementById("svg").style.opacity = e.target.value;
});
document.getElementById("diffMode").addEventListener("change", (e) => {
  document.getElementById("svg").style.mixBlendMode = e.target.checked ? "difference" : "normal";
});
document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = document.getElementById("out").value;
  const status = document.getElementById("copyStatus");
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = "Copied to clipboard.";
  } catch (e) {
    document.getElementById("out").select();
    status.textContent = "Clipboard blocked — text is selected, press Cmd/Ctrl+C.";
  }
  setTimeout(() => status.textContent = "", 3000);
});
document.getElementById("resetBtn").addEventListener("click", () => {
  Object.assign(params, JSON.parse(JSON.stringify(DEFAULTS)));
  syncControlsFromParams();
  render();
});

buildControls();
render();
document.getElementById("svg").style.opacity = document.getElementById("svgOpacity").value;
</script>
</body>
</html>
